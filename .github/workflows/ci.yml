---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes a running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: YAML lint
        run: yamllint .

      - name: Unit tests
        run: pytest -m "not emulator"

  rule-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail, rather than skip, the emulator tests if the emulator or a dataset is missing.
      KUSTO_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Restore datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw
          key: datasets-${{ hashFiles('data/manifest.yaml') }}
          # A partial match is safe: the download step re-verifies every file's SHA-256.
          restore-keys: datasets-

      # The image is pulled from Microsoft's registry on every run, never cached:
      # the licence allows pulling it, not redistributing it.
      - name: Pull emulator image
        run: docker compose pull kusto

      # Started before the download so the emulator boots while the datasets arrive;
      # files written to data/ later are visible through the bind mount.
      - name: Start emulator
        run: docker compose up -d kusto

      - name: Download datasets
        run: python scripts/download_data.py

      - name: Wait for emulator
        run: |
          for attempt in $(seq 60); do
            if curl -fs -o /dev/null -X POST http://localhost:8080/v1/rest/mgmt \
                 -H "Content-Type: application/json" \
                 -d '{"db": "NetDefaultDB", "csl": ".show version"}'; then
              echo "Emulator ready"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Kusto emulator not ready after 180 seconds"
          docker compose logs --tail 100 kusto
          exit 1

      - name: Load datasets
        run: python -m sentinel_detections.loader

      - name: Rule tests
        run: pytest -m emulator

      - name: Emulator logs
        if: failure()
        run: docker compose logs --tail 200 kusto
